version: '3'
services:
  database:
    image: postgres:15
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_password
      POSTGRES_DB: directus

  directus:
    image: directus/directus:latest
    ports:
      - 8056:8055
    volumes:
      - uploads:/directus/uploads
      - extensions:/directus/extensions
    environment:
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: 'directus_password'
      CACHE_ENABLED: 'false'
      ADMIN_EMAIL: 'admin@example.com'
      ADMIN_PASSWORD: 'password'
      KEY: 'uma-chave-aleatoria-qualquer'
      SECRET: 'um-segredo-aleatorio-qualquer'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'http://localhost:9000,http://127.0.0.1:9000'
    depends_on:
      - database

volumes:
  data:
  uploads:
  extensions:
